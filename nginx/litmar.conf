# nginx delante de litmar: sirve la web y reenvía las rutas de la API al servicio
# `api` de compose.yaml. Se monta como /etc/nginx/conf.d/default.conf.

# El DNS interno de Docker: traduce «api» a la IP del contenedor. Con `valid=10s`
# nginx vuelve a preguntar cada 10 s, así que si `api` se recrea (y cambia de IP)
# no hay que reiniciar `web`.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;

    # La web: los ficheros de src/litmar/web, montados aquí por compose.yaml.
    root /usr/share/nginx/html;
    index index.html;

    # La API, por el nombre del servicio. En una variable para que se resuelva con
    # `resolver` en cada petición y no una sola vez al arrancar nginx.
    set $api http://api:8000;

    # Cabeceras que se envían a la API junto con cada petición reenviada.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Rutas de la API que se contestan enseguida. /docs necesita también
    # /openapi.json, que es de donde lee las rutas.
    location ~ ^/(salud|fuentes|buscar|docs|openapi\.json)$ {
        proxy_pass $api;
    }

    # Una revisión tarda minutos: sin esto nginx corta a los 60 s con un 504.
    location = /revisiones {
        proxy_pass $api;
        proxy_read_timeout 10m;  # cuánto esperar la respuesta de la API
        proxy_send_timeout 10m;  # cuánto esperar mientras se le envía la petición
    }
}
